name: Release

# Релиз создаётся автоматически при пуше тега вида v1.2.3.
# Архив — чистый снимок репозитория по тегу (git archive, без .git),
# плюс стандартные Source code zip/tar.gz, которые GitHub прикладывает сам.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # Сначала тесты (тот же workflow, что на push/PR): тег, ломающий тесты,
  # не должен уезжать в релиз.
  test:
    uses: ./.github/workflows/ci.yml

  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # --notes-from-tag читает аннотацию тега из локального git — без
          # полного fetch объекта тега нет, и заметки молча деградируют до
          # сообщения коммита (поймано на v1.6.0).
          fetch-depth: 0

      - name: Собрать zip-архив
        run: |
          TAG="${GITHUB_REF_NAME}"
          NAME="meeting-transcriber-${TAG}"
          git archive --format=zip --prefix="${NAME}/" -o "${NAME}.zip" HEAD
          ls -lh "${NAME}.zip"

      - name: Подтянуть аннотацию тега
        # --notes-from-tag читает объект аннотированного тега из локального git.
        # checkout на tag-push кладёт репозиторий в detached HEAD по SHA и сам
        # объект тега не гарантирует — без него заметки молча деградируют до
        # сообщения коммита (поймано дважды на v1.6.0). fetch --force: тег мог
        # быть пересоздан после публикации.
        run: git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"

      - name: Создать релиз
        env:
          GH_TOKEN: ${{ github.token }}
        # Заметки релиза — из аннотации тега: тег всегда создаём аннотированным
        # (git tag -a v1.x.x -m "…"), развёрнутое описание попадает в релиз само.
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release create "${TAG}" \
            "meeting-transcriber-${TAG}.zip" \
            --title "${TAG}" \
            --notes-from-tag
